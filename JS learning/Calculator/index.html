<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="main-container">
        <h1>Калькулятор</h1>
        <div class="inputs-container">
            <input type="number" class="input-number" placeholder="5" id="input1">
            <input type="number" class="input-number" placeholder="10" id="input2">
        </div>
        <div class="actions-buttons-container">
            <div class="plus-button-container">
                <button id="plus" class="plus-button active-button">+</button>
            </div>
            <div class="minus-button-container">
                <button id="minus" class="minus-button">-</button>
            </div>
        </div>
        <button id="apply" class="apply-button">Вычислить</button>
        <div class="result-container">
            <h2>Результат:</h2>
            <span id="result"></span>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
